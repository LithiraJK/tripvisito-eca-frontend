name: Frontend — Build & Deploy to GCS

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch: # allow manual trigger

env:
  GCP_PROJECT_ID: project-a4f7bad0-3923-4cdb-b9b
  GCS_FRONTEND_BUCKET: tripvisito-frontend-web

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB: Build React/Vite app and deploy dist/ to GCS static hosting
  # ─────────────────────────────────────────────────────────────────────────
  build-and-deploy:
    name: Build React + Deploy to GCS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js 20 ─────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build production bundle ────────────────────────────────────────
      - name: Build React App
        env:
          VITE_API_BASE_URL: "http://8.232.84.60:8080"
        run: npm run build

      - name: Show build output
        run: ls -lh dist/

      # ── 5. Authenticate to GCP ────────────────────────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ── 6. Set up gcloud SDK ─────────────────────────────────────────────
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # ── 7. Upload dist/ to GCS, set correct cache headers ─────────────────
      - name: Upload to GCS
        run: |
          # Hashed assets (JS/CSS chunks) — long-lived cache
          gsutil -m -h "Cache-Control:public, max-age=31536000, immutable" \
            rsync -r -c \
            dist/assets/ \
            gs://${{ env.GCS_FRONTEND_BUCKET }}/assets/

          # HTML, manifest, root files — no-cache so updates are instant
          gsutil -m -h "Cache-Control:no-cache, no-store, must-revalidate" \
            rsync -r -c -x "assets/.*" \
            dist/ \
            gs://${{ env.GCS_FRONTEND_BUCKET }}/

          echo "=== Deployment complete ✅ ==="
          echo "https://storage.googleapis.com/${{ env.GCS_FRONTEND_BUCKET }}/index.html"

      # ── 8. Set CORS and SPA routing (index.html fallback) ─────────────────
      - name: Configure bucket as SPA host
        run: |
          gsutil web set \
            -m index.html \
            -e index.html \
            gs://${{ env.GCS_FRONTEND_BUCKET }}
